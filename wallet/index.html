<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Money Kit">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<title>Money Kit</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script src="../auth.js"></script>

<style>
/* ===== RESET & VARIABLES ===== */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
:root {
  --accent: #ff6b35;
  --green: #06d6a0;
  --bg: #f2f2f7;
  --card: #ffffff;
  --border: #e5e5ea;
  --text: #1a1a1a;
  --muted: #8e8e93;
  --nav-h: 60px;
}

/* ===== BASE ===== */
body {
  font-family: -apple-system, 'Hiragino Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  padding-top: calc(52px + env(safe-area-inset-top) + 8px);
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);
  -webkit-font-smoothing: antialiased;
}
body.modal-open { 
  overflow: hidden;
  padding-bottom: 0;
}

/* ===== SPLASH ===== */
.splash {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 1002;
  background: #000;
  opacity: 1;
  transition: opacity 0.7s ease;
  overflow: hidden;
}
.splash.hide { opacity: 0; pointer-events: none; }
.splash img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }

/* ===== HEADER ===== */
.header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 998;
  background: rgba(255, 255, 255, 0.97);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-left: 18px;
  padding-right: 18px;
  padding-top: env(safe-area-inset-top);
  height: calc(52px + env(safe-area-inset-top));
}
.header-logo {
  height: 38px;
  width: auto;
  object-fit: contain;
  filter: drop-shadow(0 1px 4px rgba(255, 180, 0, 0.4));
}
.header-right { display: flex; align-items: center; gap: 10px; }

/* ===== SETTINGS BUTTON ===== */
.settings-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 4px;
}
.settings-btn .material-icons-round { font-size: 24px; }

/* ===== BOTTOM NAV ===== */
.nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 999;
  background: rgba(255, 255, 255, 0.97);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  display: flex;
  padding-bottom: env(safe-area-inset-bottom);
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  will-change: transform;
}
.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  background: none;
  border: none;
  font-size: 10px;
  color: var(--muted);
  font-family: inherit;
  cursor: pointer;
}
.nav-btn.active { color: var(--accent); }
.nav-icon { font-size: 24px; line-height: 1; }

/* ===== PAGES ===== */
.page { display: none; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
.page.active { display: block; }

/* ===== PAGE: SPLIT SPECIFIC ===== */
#page-split { padding-left: 20px; padding-right: 20px; }
#page-split .page-title {
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 24px;
}

/* ===== CARD ===== */
.card {
  background: var(--card);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
}

/* ===== FORM ===== */
.form-group { margin-bottom: 12px; }
.form-group:last-child { margin-bottom: 0; }
.form-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
  display: block;
}
.form-input {
  width: 100%;
  padding: 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-family: inherit;
  font-size: 16px;
  color: var(--text);
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color 0.2s, background-color 0.2s;
}
.form-input:focus { 
  border-color: var(--accent); 
  background: #fff;
  box-shadow: none;
}

.section-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 10px;
}

/* ===== SPLIT "その他" SECTION ===== */
.other-section { margin-top: 16px; }
.other-item {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
  align-items: flex-end;
}
.other-item input { flex: 1; padding: 10px; font-size: 14px; }
.other-item .other-amount { flex: 0.7; }
.other-item button {
  flex: 0.4;
  padding: 10px;
  background: #fff0f0;
  color: #e63262;
  border: 1px solid #ffd6d6;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}

.btn-add-other {
  display: block;
  width: 100%;
  padding: 12px;
  background: var(--bg);
  border: 1.5px dashed var(--border);
  color: var(--muted);
  border-radius: 10px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 4px;
}
.btn-add-other:active { opacity: 0.7; }

/* ===== RESULT CARD ===== */
.result-card {
  background: linear-gradient(135deg, rgba(255, 107, 53, 0.08) 0%, rgba(6, 214, 160, 0.08) 100%);
  border: 1px solid rgba(255, 107, 53, 0.15);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 12px;
  text-align: center;
}
.result-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.result-total { font-size: 28px; font-weight: 800; color: var(--text); margin-bottom: 16px; }
.result-sep { height: 1px; background: rgba(0, 0, 0, 0.08); margin: 16px 0; }
.result-sublabel { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.result-split { font-size: 36px; font-weight: 800; color: var(--accent); }

/* ===== RESET LINK ===== */
.reset-link {
  text-align: center;
  padding: 8px;
  font-size: 13px;
  color: var(--muted);
  text-decoration: none;
  cursor: pointer;
  display: block;
}
.reset-link:active { opacity: 0.6; }

/* ===== BUTTONS ===== */
.btn-primary {
  display: block;
  width: 100%;
  padding: 15px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-family: inherit;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
  -webkit-appearance: none;
}
.btn-primary:active { opacity: 0.75; }

.btn-secondary {
  display: block;
  width: 100%;
  padding: 12px;
  background: var(--bg);
  border: 1.5px dashed var(--border);
  color: var(--muted);
  border-radius: 10px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 4px;
}
.btn-secondary:active { opacity: 0.7; }

.btn-delete {
  flex: 1;
  padding: 13px;
  background: #fff0f0;
  color: #e63262;
  border: 1px solid #ffd6d6;
  border-radius: 12px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}
.btn-delete:active { opacity: 0.75; }

.btn-close {
  flex: 1;
  padding: 13px;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 12px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  margin-left: 8px;
}
.btn-close:active { opacity: 0.75; }

/* ===== STATS GRID ===== */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}
.stat-card {
  background: var(--card);
  border-radius: 14px;
  padding: 14px;
  border: 1px solid var(--border);
}
.stat-card.pink { background: #fff5f5; border-color: #ffd6d6; }
.stat-card.mint { background: #f0fdf9; border-color: #b3f0e3; }
.stat-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
.stat-value { font-size: 22px; font-weight: 800; }

/* ===== EMPTY STATE ===== */
.empty { text-align: center; padding: 48px 20px; }
.empty-text { font-size: 14px; color: var(--muted); line-height: 1.6; }

/* ===== DEBT ITEM ===== */
.debt-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
}
.debt-info { flex: 1; min-width: 0; }
.debt-name { font-size: 14px; font-weight: 600; }
.debt-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }
.debt-amount { text-align: right; font-size: 16px; font-weight: 700; color: var(--accent); }

/* ===== FIXED ITEM ===== */
.fixed-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.fixed-item:last-child { border-bottom: none; }
.fixed-info { flex: 1; }
.fixed-category { font-size: 14px; font-weight: 600; }
.fixed-amount { text-align: right; font-size: 15px; font-weight: 700; }
.fixed-remove {
  flex-shrink: 0;
  background: none;
  border: none;
  color: var(--muted);
  font-size: 18px;
  cursor: pointer;
  padding: 4px 8px;
  margin-left: 8px;
}

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: #333;
  color: #fff;
  border-radius: 10px;
  padding: 10px 18px;
  font-size: 13px;
  font-weight: 600;
  opacity: 0;
  transition: all 0.25s;
  pointer-events: none;
  white-space: nowrap;
  z-index: 1001;
  max-width: calc(100vw - 40px);
  text-align: center;
}
.toast.error { background: #e63262; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===== MODAL ===== */
.modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: flex-end;
  background: rgba(0, 0, 0, 0.4);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.modal.show { opacity: 1; pointer-events: auto; }
.modal-sheet {
  background: #fff;
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  overflow-x: hidden;
  padding-bottom: calc(env(safe-area-inset-bottom) + 16px);
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.15);
  touch-action: pan-y;
  -webkit-overflow-scrolling: touch;
}
.modal.show .modal-sheet { transform: translateY(0); }
.modal-handle {
  width: 36px;
  height: 4px;
  background: #e0e0e0;
  border-radius: 2px;
  margin: 12px auto 0;
}
.modal-header {
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--border);
}
.modal-title { font-size: 15px; font-weight: 700; }
.modal-body { padding: 16px 20px; }
.modal-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 0;
  border-bottom: 1px solid var(--border);
}
.modal-row:last-child { border-bottom: none; }
.modal-label { font-size: 13px; color: var(--muted); }
.modal-value { font-size: 15px; font-weight: 600; }
.modal-value.accent { color: var(--accent); font-size: 18px; font-weight: 700; }
.modal-footer { 
  padding: 16px 20px 0; 
  display: flex; 
  gap: 10px; 
}
.modal-footer button {
  flex: 1 !important;
  width: auto !important;
  height: 48px !important;
  padding: 0 8px !important;
  margin: 0 !important;
  font-size: 14px !important;
  font-weight: 700 !important;
  line-height: 1.2 !important;
  text-align: center !important;
  border-radius: 12px !important;
  cursor: pointer !important;
  border: none !important;
  font-family: inherit !important;
  -webkit-appearance: none !important;
  appearance: none !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
}
.modal-footer .btn-delete {
  background: #fff0f0 !important;
  color: #e63262 !important;
  border: 1px solid #ffd6d6 !important;
}
.modal-footer .btn-close {
  background: var(--bg) !important;
  color: var(--text) !important;
  border: 1px solid var(--border) !important;
}
.modal-footer .btn-primary {
  background: var(--accent) !important;
  color: #fff !important;
}

.debt-transaction-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.debt-transaction-item:last-child { border-bottom: none; }
.trans-date { font-size: 12px; color: var(--muted); }
.trans-amount { font-size: 14px; font-weight: 700; }
</style>
</head>
<body>

<!-- ===== SPLASH ===== -->
<div class="splash" id="splash">
  <img src="splash.PNG" alt="">
</div>

<!-- ===== HEADER ===== -->
<header class="header" id="main-header">
  <img class="header-logo" src="logo.PNG" alt="Money Kit">
  <div class="header-right">
    <button class="settings-btn" onclick="openSettings()">
      <span class="material-icons-round">settings</span>
    </button>
  </div>
</header>

<!-- ===== PAGE: SPLIT ===== -->
<div class="page active" id="page-split">
  <div class="page-title">割り勘計算</div>

  <div class="card">
    <div class="form-group">
      <label class="form-label">家賃（円）</label>
      <input class="form-input" id="f-rent" type="number" inputmode="numeric" placeholder="0" oninput="onRentChange()">
    </div>
    <div class="form-group">
      <label class="form-label">カード代（円）</label>
      <input class="form-input" id="f-card" type="number" inputmode="numeric" placeholder="0" oninput="calc()">
    </div>
  </div>

  <div class="card">
    <div class="section-label">その他</div>
    <div id="other-list"></div>
    <button class="btn-add-other" onclick="addOtherItem()">+ 項目を追加</button>
  </div>

  <div class="result-card">
    <div class="result-label">合計金額</div>
    <div class="result-total" id="r-total">¥0</div>
    <div class="result-sep"></div>
    <div class="result-sublabel">1人あたり（2人で割り勘）</div>
    <div class="result-split" id="r-split">¥0</div>
  </div>

  <a class="reset-link" onclick="resetSplit()">その他・カード代をリセット</a>
</div>

<!-- ===== PAGE: DEBT ===== -->
<div class="page" id="page-debt">
  <div class="card">
    <div class="section-label" style="margin-bottom:16px">貸し借り管理</div>
    <div id="debt-list">
      <div class="empty">
        <span class="material-icons-round" style="font-size:52px;color:var(--muted);display:block;text-align:center;margin-bottom:12px">account_balance_wallet</span>
        <div class="empty-text" style="text-align:center">まだ記録がありません<br>相手を選んでね</div>
      </div>
    </div>
  </div>
  <div class="card">
    <button class="btn-primary" onclick="openAddDebtPerson()">+ 相手を追加</button>
  </div>
</div>

<!-- ===== PAGE: FIXED ===== -->
<div class="page" id="page-fixed">
  <div class="card">
    <div class="section-label">固定費管理</div>
    <div id="fixed-list">
      <div class="empty">
        <span class="material-icons-round" style="font-size:52px;color:var(--muted);display:block;text-align:center;margin-bottom:12px">receipt_long</span>
        <div class="empty-text" style="text-align:center">まだ登録がありません<br>追加してね</div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="section-label">合計</div>
    <div style="font-size:26px;font-weight:800;color:var(--accent)">¥<span id="fixed-total">0</span></div>
  </div>
  <div class="card">
    <div class="form-group">
      <label class="form-label">費目</label>
      <input class="form-input" id="f-fixed-category" type="text" placeholder="例：携帯料金" autocomplete="off">
    </div>
    <div class="form-group">
      <label class="form-label">金額（円）</label>
      <input class="form-input" id="f-fixed-amount" type="number" inputmode="numeric" placeholder="0" autocomplete="off">
    </div>
    <button class="btn-primary" onclick="addFixed()">追加</button>
  </div>
</div>

<!-- ===== BOTTOM NAV ===== -->
<nav class="nav" id="main-nav">
  <button class="nav-btn active" onclick="showPage('split', this)">
    <span class="material-icons-round nav-icon">calculate</span>割り勘
  </button>
  <button class="nav-btn" onclick="showPage('debt', this)">
    <span class="material-icons-round nav-icon">account_balance</span>貸し借り
  </button>
  <button class="nav-btn" onclick="showPage('fixed', this)">
    <span class="material-icons-round nav-icon">receipt_long</span>固定費
  </button>
</nav>

<div class="toast" id="toast"></div>

<!-- ===== DEBT DETAIL MODAL ===== -->
<div class="modal" id="debt-detail-modal" onclick="closeDebtDetail(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="dd-person-name"></div>
    </div>
    <div class="modal-body">
      <div style="margin-bottom:16px">
        <div class="modal-label">合計金額</div>
        <div style="font-size:24px;font-weight:800;color:var(--accent);margin-top:4px">¥<span id="dd-total">0</span></div>
      </div>
      <div style="margin-bottom:16px">
        <div class="section-label" style="margin-bottom:10px">取引記録</div>
        <div id="dd-transactions"></div>
      </div>
      <div style="margin-bottom:20px;padding-top:16px;border-top:1px solid var(--border)">
        <div class="section-label" style="margin-bottom:10px">追加</div>
        <div class="form-group">
          <label class="form-label">金額（円）</label>
          <input class="form-input" id="dd-add-amount" type="number" inputmode="numeric" placeholder="0">
        </div>
        <div class="form-group">
          <label class="form-label">日付</label>
          <input class="form-input" id="dd-add-date" type="date">
        </div>
        <div class="form-group">
          <label class="form-label">メモ</label>
          <input class="form-input" id="dd-add-notes" type="text" placeholder="例：飲み会代" autocomplete="off">
        </div>
      </div>
      <div style="padding-top:16px;border-top:1px solid var(--border)">
        <div class="section-label" style="margin-bottom:10px">返済</div>
        <div class="form-group">
          <label class="form-label">金額（円）</label>
          <input class="form-input" id="dd-repay-amount" type="number" inputmode="numeric" placeholder="0">
        </div>
        <div class="form-group">
          <label class="form-label">日付</label>
          <input class="form-input" id="dd-repay-date" type="date">
        </div>
        <button class="btn-primary" onclick="repayDebt()" style="width:100%;margin-top:12px">返済する</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-delete" onclick="deleteDebtPerson()">削除</button>
      <button class="btn-close" onclick="closeDebtDetail()">閉じる</button>
      <button class="btn-primary" onclick="addDebtTransaction()">+ 追加</button>
    </div>
  </div>
</div>

<!-- ===== ADD DEBT PERSON MODAL ===== -->
<div class="modal" id="add-debt-person-modal" onclick="closeAddDebtPerson(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title">新規相手を追加</div>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">相手の名前</label>
        <input class="form-input" id="adp-name" type="text" placeholder="例：太郎" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label">初期金額（円）</label>
        <input class="form-input" id="adp-amount" type="number" inputmode="numeric" placeholder="0">
      </div>
      <div class="form-group">
        <label class="form-label">日付</label>
        <input class="form-input" id="adp-date" type="date">
      </div>
      <div class="form-group">
        <label class="form-label">メモ（オプション）</label>
        <input class="form-input" id="adp-notes" type="text" placeholder="例：飲み会代" autocomplete="off">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-close" onclick="closeAddDebtPerson()">キャンセル</button>
      <button class="btn-primary" onclick="saveNewDebtPerson()">追加</button>
    </div>
  </div>
</div>

<!-- ===== SETTINGS MODAL ===== -->
<div class="modal" id="settings-modal" onclick="closeSettingsOutside(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title">設定</div>
    </div>
    <div class="modal-body">
      <div style="margin-bottom:20px">
        <div class="section-label" style="margin-bottom:8px">ログアウト</div>
        <button class="btn-delete" style="width:100%" onclick="signOutAndRedirect('../login.html')">ログアウト</button>
      </div>
    </div>
  </div>
</div>

<script>
// ================================================================
// iOS PWA: キーボード表示後のナビバーズレ修正（改善版）
// ================================================================
(function () {
  function init() {
    var nav = document.getElementById('main-nav');
    if (!nav || !window.visualViewport) return;
    
    var baseHeight = window.visualViewport.height;
    var resizeTimer = null;
    var isModalOpen = false;

    function resetNav() {
      nav.style.transition = 'transform 0.25s ease';
      nav.style.transform = 'translateY(0)';
    }

    window.visualViewport.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      var vv = window.visualViewport;
      var diff = baseHeight - vv.height;
      
      if (diff > 80) {
        // キーボード表示時：ナビを上にスライド
        nav.style.transition = 'none';
        nav.style.transform = 'translateY(' + diff + 'px)';
      } else {
        // キーボード閉じた時：復帰
        resizeTimer = setTimeout(function () {
          resetNav();
          // モーダルが開いている場合、スクロール位置をリセット
          if (isModalOpen) {
            var sheet = document.querySelector('.modal.show .modal-sheet');
            if (sheet) {
              setTimeout(function () {
                sheet.scrollTop = sheet.scrollTop;
              }, 50);
            }
          }
        }, 50);
      }
    });

    window.addEventListener('orientationchange', function () {
      clearTimeout(resizeTimer);
      setTimeout(function () {
        baseHeight = window.visualViewport.height;
        resetNav();
      }, 300);
    });

    // ページ切り替え時にもリセット
    document.querySelectorAll('.nav-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        clearTimeout(resizeTimer);
        setTimeout(resetNav, 50);
      });
    });

    // モーダル開閉を監視
    var observer = new MutationObserver(function () {
      isModalOpen = document.querySelector('.modal.show') !== null;
    });
    observer.observe(document.body, { 
      subtree: true, 
      attributes: true, 
      attributeFilter: ['class'] 
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

// ================================================================
// 認証ガード
// ================================================================
requireAuth();

// ================================================================
// ユーティリティ
// ================================================================
function fmt(n) {
  return Math.round(n || 0).toLocaleString('ja-JP');
}

function todayIso() {
  var t = new Date();
  return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
}

function toast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + (type || 'success') + ' show';
  clearTimeout(el._t);
  el._t = setTimeout(function () { el.classList.remove('show'); }, 2800);
}

// ================================================================
// ページナビゲーション
// ================================================================
function showPage(name, btn) {
  document.querySelectorAll('.page').forEach(function (p) { p.classList.remove('active'); });
  document.querySelectorAll('.nav-btn').forEach(function (b) { b.classList.remove('active'); });
  document.getElementById('page-' + name).classList.add('active');
  btn.classList.add('active');
  window.scrollTo(0, 0);
  if (name === 'debt') renderDebtList();
  if (name === 'fixed') renderFixedList();
}

// ================================================================
// DB操作
// ================================================================
async function dbDebtGetAll() {
  var c = getClient();
  var result = await c.from('wallet_debts').select('*').order('date', { ascending: false });
  if (result.error) throw result.error;
  return result.data || [];
}

async function dbDebtInsert(item) {
  var c = getClient();
  var result = await c.from('wallet_debts').insert(item);
  if (result.error) throw result.error;
}

async function dbDebtDelete(id) {
  var c = getClient();
  var result = await c.from('wallet_debts').delete().eq('id', id);
  if (result.error) throw result.error;
}

async function dbFixedGetAll() {
  var c = getClient();
  var result = await c.from('wallet_fixed').select('*').order('created_at', { ascending: false });
  if (result.error) throw result.error;
  return result.data || [];
}

async function dbFixedInsert(item) {
  var c = getClient();
  var result = await c.from('wallet_fixed').insert(item);
  if (result.error) throw result.error;
}

async function dbFixedDelete(id) {
  var c = getClient();
  var result = await c.from('wallet_fixed').delete().eq('id', id);
  if (result.error) throw result.error;
}

// ================================================================
// 割り勘ページ
// ================================================================
var otherItems = [];
var otherIdCounter = 0;

function onRentChange() {
  var val = document.getElementById('f-rent').value;
  localStorage.setItem('wallet_rent', val);
  calc();
}

function calc() {
  var rent = +document.getElementById('f-rent').value || 0;
  var card = +document.getElementById('f-card').value || 0;
  var otherTotal = otherItems.reduce(function (s, i) { return s + (+i.price || 0); }, 0);
  var total = rent + card + otherTotal;
  document.getElementById('r-total').textContent = '¥' + fmt(total);
  document.getElementById('r-split').textContent = '¥' + fmt(total / 2);
}

function addOtherItem() {
  var id = 'o' + (otherIdCounter++);
  otherItems.push({ id: id, name: '', price: '' });
  renderOther();
}

function renderOther() {
  var list = document.getElementById('other-list');
  if (otherItems.length === 0) {
    list.innerHTML = '';
  } else {
    list.innerHTML = otherItems.map(function (item) {
      return '<div class="other-item">'
        + '<input class="form-input" type="text" placeholder="項目名" value="' + (item.name || '') + '" oninput="updateOther(\'' + item.id + '\', \'name\', this.value)">'
        + '<input class="form-input other-amount" type="number" inputmode="numeric" placeholder="0" value="' + (item.price || '') + '" oninput="updateOther(\'' + item.id + '\', \'price\', this.value)">'
        + '<button onclick="removeOther(\'' + item.id + '\')">削除</button>'
        + '</div>';
    }).join('');
  }
  calc();
}

function updateOther(id, field, value) {
  var item = otherItems.find(function (i) { return i.id === id; });
  if (item) item[field] = value;
  calc();
}

function removeOther(id) {
  otherItems = otherItems.filter(function (i) { return i.id !== id; });
  renderOther();
}

function resetSplit() {
  if (!confirm('カード代とその他の項目をリセットしますか？（家賃は残ります）')) return;
  document.getElementById('f-card').value = '';
  otherItems = [];
  renderOther();
  calc();
}

// ================================================================
// 貸し借りページ
// ================================================================
var currentDebtPerson = null;

async function renderDebtList() {
  try {
    var all = await dbDebtGetAll();
    var grouped = {};
    all.forEach(function (item) {
      if (!grouped[item.person_name]) grouped[item.person_name] = [];
      grouped[item.person_name].push(item);
    });

    var list = document.getElementById('debt-list');
    if (Object.keys(grouped).length === 0) {
      list.innerHTML =
        '<div class="empty">'
        + '<span class="material-icons-round" style="font-size:52px;color:var(--muted);display:block;text-align:center;margin-bottom:12px">account_balance_wallet</span>'
        + '<div class="empty-text" style="text-align:center">まだ記録がありません<br>相手を選んでね</div>'
        + '</div>';
    } else {
      list.innerHTML = Object.entries(grouped).map(function (e) {
        var person = e[0];
        var items = e[1];
        var total = items.reduce(function (s, i) { return s + (+i.amount || 0); }, 0);
        return '<div class="debt-item" onclick="showDebtDetail(\'' + person.replace(/'/g, "\\'") + '\')">'
          + '<div class="debt-info">'
          + '<div class="debt-name">' + person + '</div>'
          + '<div class="debt-sub">' + items.length + '件</div>'
          + '</div>'
          + '<div class="debt-amount">¥' + fmt(total) + '</div>'
          + '</div>';
      }).join('');
    }
  } catch (e) {
    toast('取得失敗: ' + e.message, 'error');
  }
}

async function showDebtDetail(person) {
  currentDebtPerson = person;
  try {
    var all = await dbDebtGetAll();
    var items = all.filter(function (i) { return i.person_name === person; });
    var total = items.reduce(function (s, i) { return s + (+i.amount || 0); }, 0);

    document.getElementById('dd-person-name').textContent = person;
    document.getElementById('dd-total').textContent = fmt(total);
    document.getElementById('dd-add-amount').value = '';
    document.getElementById('dd-add-date').value = todayIso();
    document.getElementById('dd-add-notes').value = '';
    document.getElementById('dd-repay-amount').value = '';
    document.getElementById('dd-repay-date').value = todayIso();

    var trans = document.getElementById('dd-transactions');
    trans.innerHTML = items.map(function (i) {
      return '<div class="debt-transaction-item">'
        + '<div><div class="trans-date">' + i.date + '</div><div style="font-size:12px;color:var(--muted);margin-top:2px">' + (i.notes || '-') + '</div></div>'
        + '<div class="trans-amount">¥' + fmt(i.amount) + '</div>'
        + '</div>';
    }).join('');

    document.getElementById('debt-detail-modal').classList.add('show');
    document.body.classList.add('modal-open');
    resetNavBar();
  } catch (e) {
    toast('読み込み失敗: ' + e.message, 'error');
  }
}

function closeDebtDetail(e) {
  if (!e || e.target === document.getElementById('debt-detail-modal')) {
    document.getElementById('debt-detail-modal').classList.remove('show');
    document.body.classList.remove('modal-open');
    resetNavBar();
  }
}

async function addDebtTransaction() {
  var amount = +document.getElementById('dd-add-amount').value || 0;
  var date = document.getElementById('dd-add-date').value;
  var notes = document.getElementById('dd-add-notes').value.trim();

  if (!amount) { toast('金額を入力してください', 'error'); return; }

  try {
    await dbDebtInsert({
      id: Date.now(),
      person_name: currentDebtPerson,
      amount: amount,
      date: date,
      notes: notes
    });
    toast('追加しました');
    showDebtDetail(currentDebtPerson);
    renderDebtList();
  } catch (e) {
    toast('追加失敗: ' + e.message, 'error');
  }
}

async function deleteDebtPerson() {
  if (!confirm(currentDebtPerson + ' との記録をすべて削除しますか？')) return;
  try {
    var all = await dbDebtGetAll();
    var items = all.filter(function (i) { return i.person_name === currentDebtPerson; });
    for (var i = 0; i < items.length; i++) {
      await dbDebtDelete(items[i].id);
    }
    toast('削除しました');
    closeDebtDetail();
    renderDebtList();
  } catch (e) {
    toast('削除失敗: ' + e.message, 'error');
  }
}

async function repayDebt() {
  var amount = +document.getElementById('dd-repay-amount').value || 0;
  var date = document.getElementById('dd-repay-date').value;

  if (!amount) { toast('返済金額を入力してください', 'error'); return; }

  try {
    await dbDebtInsert({
      id: Date.now(),
      person_name: currentDebtPerson,
      amount: -amount,
      date: date,
      notes: '返済'
    });
    toast('返済しました');
    showDebtDetail(currentDebtPerson);
    renderDebtList();
  } catch (e) {
    toast('返済失敗: ' + e.message, 'error');
  }
}

function openAddDebtPerson() {
  document.getElementById('adp-name').value = '';
  document.getElementById('adp-amount').value = '';
  document.getElementById('adp-date').value = todayIso();
  document.getElementById('adp-notes').value = '';
  document.getElementById('add-debt-person-modal').classList.add('show');
  document.body.classList.add('modal-open');
  resetNavBar();
}

function closeAddDebtPerson(e) {
  if (!e || e.target === document.getElementById('add-debt-person-modal')) {
    document.getElementById('add-debt-person-modal').classList.remove('show');
    document.body.classList.remove('modal-open');
    resetNavBar();
  }
}

function resetNavBar() {
  var nav = document.getElementById('main-nav');
  if (nav) {
    nav.style.transition = 'transform 0.25s ease';
    nav.style.transform = 'translateY(0)';
  }
  
  // モーダルが開いている場合、キーボード由来のフォーカスをクリア
  var activeModal = document.querySelector('.modal.show');
  if (activeModal) {
    var activeInput = activeModal.querySelector('input:focus, textarea:focus');
    if (activeInput && document.activeElement === activeInput) {
      // キーボードが完全に閉じたタイミングでblur
      setTimeout(function () {
        activeInput.blur();
      }, 100);
    }
  }
}

async function saveNewDebtPerson() {
  var name = document.getElementById('adp-name').value.trim();
  var amount = +document.getElementById('adp-amount').value || 0;
  var date = document.getElementById('adp-date').value;
  var notes = document.getElementById('adp-notes').value.trim();

  if (!name) { toast('相手の名前を入力してください', 'error'); return; }
  if (!amount) { toast('金額を入力してください', 'error'); return; }

  try {
    await dbDebtInsert({
      id: Date.now(),
      person_name: name,
      amount: amount,
      date: date,
      notes: notes
    });
    toast('追加しました');
    closeAddDebtPerson();
    renderDebtList();
  } catch (e) {
    toast('追加失敗: ' + e.message, 'error');
  }
}

// ================================================================
// 固定費ページ
// ================================================================
async function renderFixedList() {
  try {
    var all = await dbFixedGetAll();
    var list = document.getElementById('fixed-list');
    var total = all.reduce(function (s, i) { return s + (+i.amount || 0); }, 0);

    document.getElementById('fixed-total').textContent = fmt(total);

    if (all.length === 0) {
      list.innerHTML =
        '<div class="empty">'
        + '<span class="material-icons-round" style="font-size:52px;color:var(--muted);display:block;text-align:center;margin-bottom:12px">receipt_long</span>'
        + '<div class="empty-text" style="text-align:center">まだ登録がありません<br>追加してね</div>'
        + '</div>';
    } else {
      list.innerHTML = '<div class="card">' + all.map(function (i) {
        return '<div class="fixed-item">'
          + '<div class="fixed-info"><div class="fixed-category">' + i.category + '</div></div>'
          + '<div class="fixed-amount">¥' + fmt(i.amount) + '</div>'
          + '<button class="fixed-remove" onclick="deleteFixed(' + i.id + ')">×</button>'
          + '</div>';
      }).join('') + '</div>';
    }
  } catch (e) {
    toast('取得失敗: ' + e.message, 'error');
  }
}

async function addFixed() {
  var category = document.getElementById('f-fixed-category').value.trim();
  var amount = +document.getElementById('f-fixed-amount').value || 0;

  if (!category) { toast('費目を入力してください', 'error'); return; }
  if (!amount) { toast('金額を入力してください', 'error'); return; }

  try {
    await dbFixedInsert({
      id: Date.now(),
      category: category,
      amount: amount
    });
    toast('追加しました');
    document.getElementById('f-fixed-category').value = '';
    document.getElementById('f-fixed-amount').value = '';
    renderFixedList();
  } catch (e) {
    toast('追加失敗: ' + e.message, 'error');
  }
}

async function deleteFixed(id) {
  if (!confirm('削除しますか？')) return;
  try {
    await dbFixedDelete(id);
    toast('削除しました');
    renderFixedList();
  } catch (e) {
    toast('削除失敗: ' + e.message, 'error');
  }
}

// ================================================================
// 設定モーダル
// ================================================================
function openSettings() {
  document.getElementById('settings-modal').classList.add('show');
  document.body.classList.add('modal-open');
  resetNavBar();
}

function closeSettingsOutside(e) {
  if (e.target === document.getElementById('settings-modal')) {
    document.getElementById('settings-modal').classList.remove('show');
    document.body.classList.remove('modal-open');
    resetNavBar();
  }
}

// ================================================================
// 初期化
// ================================================================
(function () {
  var savedRent = localStorage.getItem('wallet_rent');
  if (savedRent) document.getElementById('f-rent').value = savedRent;

  calc();
  renderDebtList();
  renderFixedList();

  // スプラッシュ非表示
  setTimeout(function () {
    var s = document.getElementById('splash');
    s.classList.add('hide');
    setTimeout(function () { s.remove(); }, 800);
  }, 2200);
})();
</script>
</body>
</html>
